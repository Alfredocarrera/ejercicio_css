<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busqueda</title>
    <link rel="stylesheet" href="./css/style.css">
    
</head>
    <body>
        <h1>Pedir nombre</h1>
        <form target="_blank">
            <label for="name">Nombre</label>
            <input type="text" id="name" name="nombre" required minlength="5">

            <br><br>

            <label for="lastname">Apellido</label>
            <input type="text" id="lastname" name="apellido">

            <br><br>

            <label for="email">Correo electrónico</label>
            <input type="email" name="correo" id="email">

            <br><br>

            <label for="password">Contraseña</label>
            <input type="password" name="contrasena" id="password">

            <br><br>

            <label for="age">Edad</label>
            <input type="number" name="edad" id="age" min="18">

            <br><br>

            <label for="birthdate">Fecha de nacimiento</label>
            <input type="date" name="nacimiento" id="birthdate" max="2015-01-01" required>
            <!-- personas que nacieron antes del 01 de enero del 2015 -->

            <br><br>

            <label for="phone">Número telefónico</label>
            <input type="tel" id="phone" name="telefono">

            <br><br>

            <label>Seleccione género de su libro:</label>
            <input type="radio" name="genre" value="A"> Aventura
            <input type="radio" name="genre" value="M"> Mangas
            <input type="radio" name="genre" value="EM"> Edad Media
            <input type="radio" name="genre" value="F"> Fantasia

            <br><br>

            <label for="name book">Nombre del libro</label>
            <input type="text" name="libro" id="name book" value="">

            <br><br>

            <label>Caracteristicas del libro:</label>
            <input type="checkbox" name="hobbie" value="read">Pasta dura
            <input type="checkbox" name="hobbie" value="run">Pasta suave
            <input type="checkbox" name="hobbie" value="swim">Edicion de Aniversario

            <br><br>

            <label>¿Qué tan satisfecho con tu compra?</label>
            <br><br>
            <input type="range" min="1" max="5" name="satisfaccion" value="3">

            <br><br>
            <input type="submit">
            <input type="reset">
        </form>
        <a href="http://127.0.0.1:5500/index.html#:~:text=Libreria%20Un%20Libro%20Mas">Inicio</a>
        <footer>
            <p> 
                Libreria Un Libro mas
                2026
                Contacto: unlibromas@gmail.com
                autor:Alfredo Efrain Carrera Aguilar
            </p>    
        </footer>
    </body>
</html>
